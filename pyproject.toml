[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuss-censor"
version = "1.0.0"
description = "Automated Multilingual Audio & Video Profanity Censoring for Hindi, English, and Hinglish."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "JIYAAD-GldTON" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "openai-whisper>=20231117",
    "customtkinter>=5.2.0,<6.0.0",
    "syncedlyrics>=1.0.0,<2.0.0",
    "sounddevice>=0.4.6,<1.0.0",
    "pydub>=0.25.1,<1.0.0",
    "numpy>=1.24.0,<3.0.0",
    "yt-dlp>=2024.01.01",
    "click>=8.1.0,<9.0.0",
    "rich>=13.0.0,<14.0.0",
    "scipy>=1.11.0,<2.0.0",
    "torch>=2.0.0,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "spotdl>=4.2.0,<5.0.0",
    "mutagen>=0.47.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
cuss-censor = "censor:cli"

[project.urls]
Homepage = "https://github.com/JIYAAD-GldTON/Music-censor-and-download"
Repository = "https://github.com/JIYAAD-GldTON/Music-censor-and-download"
Issues = "https://github.com/JIYAAD-GldTON/Music-censor-and-download/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modes*", "ui*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.wav", "*.bat", "*.sh"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
